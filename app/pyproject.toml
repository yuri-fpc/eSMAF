[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "esmaf"
version = "2.0.0"
description = "Electronic Soil Management Assessment Framework - desktop application"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "eSMAF authors"}]
keywords = ["soil health", "SMAF", "soil quality", "agronomy"]
dependencies = [
    "PySide6>=6.6",
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "openpyxl>=3.1",
    "XlsxWriter>=3.1",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pyinstaller>=6.3"]

[project.scripts]
esmaf = "esmaf_app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
esmaf_core = ["data/*.csv", "data/models/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
